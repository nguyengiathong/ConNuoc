name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional repository secrets for signing with your own key (see README).
      KEYSTORE_BASE64: ${{ secrets.CONNUOC_KEYSTORE_BASE64 }}
      CONNUOC_KEYSTORE_PASSWORD: ${{ secrets.CONNUOC_KEYSTORE_PASSWORD }}
      CONNUOC_KEY_ALIAS: ${{ secrets.CONNUOC_KEY_ALIAS }}
      CONNUOC_KEY_PASSWORD: ${{ secrets.CONNUOC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Use the release key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CONNUOC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ConNuoc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ConNuoc-apk
          path: ConNuoc.apk

      - name: Publish as the "apk-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest ConNuoc.apk \
            --target "$GITHUB_SHA" \
            --title "Con Nước – APK mới nhất" \
            --notes "Bản build từ commit ${GITHUB_SHA::7} (nhánh ${GITHUB_REF_NAME}). Tải ConNuoc.apk bên dưới và mở trên điện thoại Android để cài."
